<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manasseh Randriamitsiry - Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round|Material+Icons+Outlined" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "var(--md-sys-color-primary)",
            "on-primary": "var(--md-sys-color-on-primary)",
            "primary-container": "var(--md-sys-color-primary-container)",
            "on-primary-container": "var(--md-sys-color-on-primary-container)",
            secondary: "var(--md-sys-color-secondary)",
            "on-secondary": "var(--md-sys-color-on-secondary)",
            "secondary-container": "var(--md-sys-color-secondary-container)",
            "on-secondary-container": "var(--md-sys-color-on-secondary-container)",
            tertiary: "var(--md-sys-color-tertiary)",
            "on-tertiary": "var(--md-sys-color-on-tertiary)",
            "tertiary-container": "var(--md-sys-color-tertiary-container)",
            "on-tertiary-container": "var(--md-sys-color-on-tertiary-container)",
            error: "var(--md-sys-color-error)",
            "on-error": "var(--md-sys-color-on-error)",
            "error-container": "var(--md-sys-color-error-container)",
            "on-error-container": "var(--md-sys-color-on-error-container)",
            background: "var(--md-sys-color-background)",
            "on-background": "var(--md-sys-color-on-background)",
            surface: "var(--md-sys-color-surface)",
            "on-surface": "var(--md-sys-color-on-surface)",
            "surface-variant": "var(--md-sys-color-surface-variant)",
            "on-surface-variant": "var(--md-sys-color-on-surface-variant)",
            "surface-container": "var(--md-sys-color-surface-container)",
            "surface-container-high": "var(--md-sys-color-surface-container-high)",
            outline: "var(--md-sys-color-outline)",
            "outline-variant": "var(--md-sys-color-outline-variant)",
            shadow: "var(--md-sys-color-shadow)",
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'md3': '1.75rem',
          }
        },
      },
    }
  </script>
  <style>
    :root {
      /* Light Theme */
      --md-sys-color-primary: #02579c;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d7e3ff;
      --md-sys-color-on-primary-container: #001b3e;
      --md-sys-color-secondary: #565e71;
      --md-sys-color-on-secondary: #ffffff;
      --md-sys-color-secondary-container: #dae2f9;
      --md-sys-color-on-secondary-container: #131c2b;
      --md-sys-color-tertiary: #715574;
      --md-sys-color-on-tertiary: #ffffff;
      --md-sys-color-tertiary-container: #fbd7fc;
      --md-sys-color-on-tertiary-container: #29132e;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-on-error: #ffffff;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-background: #fdfcff;
      --md-sys-color-on-background: #1a1c1e;
      --md-sys-color-surface: #fdfcff;
      --md-sys-color-on-surface: #1a1c1e;
      --md-sys-color-surface-variant: #e1e2ec;
      --md-sys-color-on-surface-variant: #44474e;
      --md-sys-color-surface-container: #f0f0f3;
      --md-sys-color-surface-container-high: #eaeaed;
      --md-sys-color-outline: #74777f;
      --md-sys-color-outline-variant: #c4c6cf;
      --md-sys-color-shadow: rgba(0, 0, 0, 0.15);
    }

    .dark {
      /* Dark Theme - M3 Indigo/Blue */
      --md-sys-color-primary: #abc7ff;
      --md-sys-color-on-primary: #002f65;
      --md-sys-color-primary-container: #00458e;
      --md-sys-color-on-primary-container: #d7e3ff;
      --md-sys-color-secondary: #bec6dc;
      --md-sys-color-on-secondary: #283141;
      --md-sys-color-secondary-container: #3f4759;
      --md-sys-color-on-secondary-container: #dae2f9;
      --md-sys-color-tertiary: #dcbce0;
      --md-sys-color-on-tertiary: #3e2844;
      --md-sys-color-tertiary-container: #563e5c;
      --md-sys-color-on-tertiary-container: #fbd7fc;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      --md-sys-color-error-container: #93000a;
      --md-sys-color-on-error-container: #ffdad6;
      --md-sys-color-background: #111318;
      --md-sys-color-on-background: #e2e2e6;
      --md-sys-color-surface: #111318;
      --md-sys-color-on-surface: #e2e2e6;
      --md-sys-color-surface-variant: #44474e;
      --md-sys-color-on-surface-variant: #c4c6cf;
      --md-sys-color-surface-container: #1d1f24;
      --md-sys-color-surface-container-high: #282a2f;
      --md-sys-color-outline: #8e9099;
      --md-sys-color-outline-variant: #44474e;
      --md-sys-color-shadow: rgba(0, 0, 0, 0.5);
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--md-sys-color-outline);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--md-sys-color-outline-variant);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
